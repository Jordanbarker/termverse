<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>termverse</title>
    <meta name="description" content="A collection of browser games that teach the terminal." />
    <meta name="theme-color" content="#0a0e14" />
    <!-- og.png is generated by `npm run screenshot:og` (scripts/visual/og-thumbnail.mjs). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="termverse" />
    <meta property="og:description" content="A collection of browser games that teach the terminal." />
    <meta property="og:url" content="https://jordanbarker.github.io/termverse/" />
    <meta property="og:image" content="https://jordanbarker.github.io/termverse/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0e14;
        --panel: #11161f;
        --border: #1f2733;
        --fg: #c9d4e3;
        --muted: #6b7889;
        --accent: #f0b429;
        --prompt: #5ec27a;
      }
      * { box-sizing: border-box; }
      html { height: 100%; }
      body { margin: 0; min-height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Cascadia Code", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      main { width: 100%; max-width: 640px; }
      .prompt { color: var(--prompt); }
      h1 { font-size: 1.6rem; margin: 0 0 0.25rem; letter-spacing: 0.04em; }
      .tagline { color: var(--muted); margin: 0 0 2rem; font-size: 0.9rem; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.75rem; }
      a.game {
        display: block;
        text-decoration: none;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.15rem;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      a.game:hover,
      a.game:focus,
      a.game:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
      .game .name { font-size: 1.1rem; color: var(--accent); }
      .game .desc { color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; }
      /* Clips are recorded by `npm run record:demo` (scripts/visual/demo-record.mjs). */
      .game video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        margin-top: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
      }
      footer { color: var(--muted); font-size: 0.75rem; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="prompt">$</span> termverse</h1>
      <p class="tagline">Terminal based browser games.</p>
      <ul>
        <li>
          <a class="game" href="./termoil/">
            <div class="name">termoil</div>
            <div class="desc">A workplace mystery played at the command line. Learn Linux, git, and data tooling as the story unfolds.</div>
            <video src="./media/termoil.mp4" muted loop playsinline preload="metadata" aria-hidden="true"></video>
          </a>
        </li>
        <li>
          <a class="game" href="./term-crunch/">
            <div class="name">term-crunch</div>
            <div class="desc">Bite-size terminal-skills challenges. Beat each task as fast as you can and chase your best times.</div>
            <video src="./media/term-crunch.mp4" muted loop playsinline preload="metadata" aria-hidden="true"></video>
          </a>
        </li>
      </ul>
    </main>
    <script>
      (function () {
        // Autoplay the card clips unless the viewer prefers reduced motion.
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.querySelectorAll(".game video").forEach(function (v) {
            v.play().catch(function () {});
          });
        }

        const games = [...document.querySelectorAll("a.game")];
        if (games.length === 0) return;

        games[0].focus();

        document.addEventListener("keydown", function (e) {
          if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
          e.preventDefault();
          const current = games.indexOf(document.activeElement);
          let next;
          if (e.key === "ArrowDown") {
            next = current === -1 ? 0 : (current + 1) % games.length;
          } else {
            next = current === -1 ? games.length - 1 : (current - 1 + games.length) % games.length;
          }
          games[next].focus();
        });
      })();
    </script>
  </body>
</html>
